<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GLEE Business Control Check</title>
<meta name="description" content="A free check that shows where your business is exposed on cash, stock and processes.">
<link rel="icon" href="logo.png">
<style>
:root{--p:#52189a;--pd:#3a0f70;--ink:#1a1a1a;--mut:#5f5a68;--bg:#f7f4fb;--line:#e3dcee;--hi:#b3261e;--me:#b26a00;--lo:#1e7a46}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.55;min-height:100vh;display:flex;flex-direction:column}
main{flex:1;width:100%;max-width:720px;margin:0 auto;padding:32px 20px 48px}
h1{font-size:clamp(28px,6vw,40px);line-height:1.15;margin:0 0 12px;letter-spacing:-.02em}
h2{font-size:22px;line-height:1.3;margin:0 0 20px}
h3{margin:0 0 6px;font-size:17px}
p{margin:0 0 14px}
.mut{color:var(--mut)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--p);outline-offset:2px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 10px;color:var(--ink)}
.opt:hover{border-color:var(--p)}
.opt.sel{border-color:var(--p);background:#efe8f8}
.in{display:block;width:100%;font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;margin:0 0 12px}
.in:focus-visible{outline:3px solid var(--p);outline-offset:1px}
.ck{display:flex;gap:10px;align-items:flex-start;margin:6px 0 16px;font-size:15px}
.ck input{margin-top:4px;width:18px;height:18px;flex:none}
.btn{background:var(--p);color:#fff;border:0;border-radius:10px;padding:13px 22px;font-weight:600}
.btn:hover{background:var(--pd)}
.ghost{background:none;border:0;color:var(--p);font-weight:600;padding:8px 0}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:0 0 6px}
.bar i{display:block;height:100%;background:var(--p);transition:width .25s}
.tag{display:inline-block;background:#efe8f8;color:var(--pd);border-radius:6px;padding:2px 9px;font-size:13px;font-weight:600;margin-bottom:10px}
.tag.sc{background:#fff1d6;color:#7a4a00}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:560px){.grid{grid-template-columns:1fr 1fr}}
.big{font-size:44px;font-weight:800;letter-spacing:-.02em;margin:0}
.h{color:var(--hi)}.m{color:var(--me)}.l{color:var(--lo)}
table{width:100%;border-collapse:collapse;margin:8px 0 24px}
td,th{text-align:left;padding:10px 6px;border-bottom:1px solid var(--line)}
td:last-child,th:last-child{text-align:right;font-weight:700}
.gap{border-left:4px solid var(--p);padding:4px 0 4px 16px;margin:0 0 22px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
footer{border-top:1px solid var(--line);background:#fff;padding:22px 20px;text-align:center;font-size:14px;color:var(--mut)}
footer img{height:44px;width:auto;display:block;margin:8px auto 0}
@media print{.noprint{display:none!important}body{background:#fff}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<footer>Built by GLEE Controls<img src="logo.png" alt="GLEE logo"></footer>
<script>
"use strict";
// [label, word for stock/inventory, word for sales]
var TYPES={
retail:["Retail / Minimart / Supermarket","stock","till sales"],
pharmacy:["Pharmacy / Healthcare","drugs and products","sales"],
cosmetics:["Cosmetics / Beauty","products","sales"],
fashion:["Fashion / Apparel","stock","sales"],
restaurant:["Restaurant / Food Business","food and drink stock","daily sales"],
ecom:["E-commerce / Online Retail","stock","online sales"],
service:["Professional / Service Business","materials and supplies","billings and receipts"],
multi:["Multi-branch Business","stock","branch sales"]
};
var AREAS=[
["cash","Cash & Sales","Money can go missing or be misreported without anyone noticing.","Reconcile cash and bank to sales every day, and separate who receives, records and banks money."],
["inv","Inventory & Stock","Unexplained stock differences are often the first sign of loss, theft or bad records.","Set a count schedule, and make one person responsible for investigating and documenting every variance."],
["proc","Processes & SOPs","If the business only works when certain people are present, it is fragile.","Write down your 5 most important routines and give each one an owner and a backup."],
["buy","Purchasing & Suppliers","Paying for the wrong price or quantity quietly drains profit.","Match every supplier invoice to the order and goods received before paying."],
["ppl","People & Accountability","Shared access and unclear roles make it hard to trace who did what.","Give each person their own login or key, and write down who is answerable for what."],
["cus","Customers & Returns","Refunds, discounts and cancelled sales are common places for leakage.","Require approval for refunds and discounts, and review them weekly."],
["tech","Records & Technology","Records that are scattered or unbacked-up can be lost or altered.","Move records into one secure system and set up automatic backups."],
["comp","Compliance & Risk","Missed filings, licences or repeated problems turn into penalties and losses.","Keep a compliance calendar with a named owner, and review repeated issues at the root."],
["grow","Growth Readiness","Controls that work at today's size often fail when the business doubles.","Set weekly reports (sales, stock, cash, margin) and decide which controls need to scale first."]
];
// [area, question, options strongest to weakest, scenario?, only for types]
var Q=[
["cash","How are {s} recorded each day?",["Every sale goes through a system that produces a daily report","We use a system, but some sales are written by hand","We write sales in a book or notebook","We only total up when the owner asks"]],
["cash","Who handles money, and who checks their work?",["Different people receive, record and bank the money, and someone independent checks","The same person receives and records, but a manager reviews it daily","One trusted person handles most of the money","One person handles everything and nobody checks"]],
["cash","How often is cash and bank matched to your sales records?",["Daily","Weekly","Monthly, or when we remember","Rarely or never"]],
["cash","A staff member closes the day with ₦180,000 in {s} recorded, but only ₦165,000 is available. What happens?",["We investigate the same day, document the cause and decide who is responsible","We ask the staff member what happened","We note it and watch if it happens again","The staff member tops it up, or we let it go"],1],
["cash","How do you match online payments and deliveries to orders?",["Every order is matched to a payment and delivery daily","Matched weekly","Matched only when a customer complains","Not matched"],0,["ecom"]],
["cash","How do you make sure all work done is billed and collected?",["Every job is tracked to invoice and payment, with follow-up","Invoiced, but collections are chased informally","Invoiced late, or when cash is short","Some work is never billed"],0,["service"]],
["inv","How are your {i} records kept?",["A live system updated with every receipt and sale","A spreadsheet updated regularly","Updated now and then","No proper record"]],
["inv","How often do you physically count {i}?",["Regular cycle counts plus a scheduled full count","A full count monthly or quarterly","Once or twice a year","Only when something looks wrong"]],
["inv","How is new {i} checked when it arrives?",["Counted against the order and invoice by someone independent, and recorded the same day","Counted against the invoice only","Signed for without a full count","Whoever is around receives it"]],
["inv","Your records show 42 units of an item, but a count finds 35. What normally happens next?",["We investigate, document the cause and correct the record with approval","We ask the staff responsible what happened","We adjust the record to match the count","We usually don't investigate unless the difference is large"],1],
["inv","How do you track batch numbers and expiry dates, and restricted or high-value items?",["Tracked by batch with regular checks, and restricted items are locked and logged","Expiry checked occasionally, restricted items logged","Checked only when we notice","No tracking"],0,["pharmacy","cosmetics"]],
["inv","How do you control food wastage and portions?",["Recipes and portions are set, and wastage is logged and reviewed","Portions by habit, some wastage logging","The cook decides, no logging","No control"],0,["restaurant"]],
["inv","How do you track sizes, colours and slow-moving stock?",["Tracked by variant in a system, slow movers reviewed monthly","Tracked by product, loosely","Checked by eye","Not tracked"],0,["fashion"]],
["inv","How do you keep shelf prices in line with system prices?",["Regular price checks, with changes approved and logged","Checked occasionally","Fixed when a customer points it out","Not checked"],0,["retail"]],
["proc","How much of your daily routine is written down?",["Written procedures that staff are trained on and follow","Some written, mostly by habit","Mostly in the owner's or manager's head","Nothing written"]],
["proc","How often does the business need the owner to step in to keep things moving?",["Rarely, staff run it by procedure","Sometimes, for exceptions","Often, even for routine decisions","Almost daily, nothing moves without the owner"]],
["proc","Your most important staff member resigns with one week's notice. What happens to their duties?",["Their process is documented and someone can take over with a proper handover","We rely on a short verbal handover","We work it out as we go","Operations would struggle until we hire"],1],
["proc","How do you compare branches and catch problems in one location?",["Standard weekly report per branch, reviewed centrally and independently","Managers send their own reports","The owner visits when there is a problem","No comparison"],0,["multi"]],
["buy","Who approves purchases before they are made?",["Written approval against a set limit","The owner or manager approves verbally","Approval happens after the purchase","Anyone can buy"]],
["buy","Before paying a supplier, what is checked?",["Invoice matched to order and goods received, including price and quantity","Invoice matched to what was delivered","The invoice looks right and is paid","We pay what the supplier asks"]],
["buy","How are business expenses tracked?",["Every expense recorded with a receipt and reviewed","Recorded, but receipts kept only sometimes","Tracked from bank statements only","Not tracked separately from personal spending"]],
["ppl","How is access to systems, tills and stores controlled?",["Each person has their own login or key, with permissions by role","Some shared logins or keys","Most logins or keys are shared","Everyone has full access"]],
["ppl","How clear are staff responsibilities?",["Written roles, and each person knows what they answer for","Understood informally","Roles overlap and it is unclear who is responsible","Nobody is clearly responsible"]],
["ppl","How do you monitor staff performance and mistakes?",["Regular reports with follow-up","Periodic informal review","Only when problems come up","We don't"]],
["cus","How are refunds, discounts and cancelled sales handled?",["They need approval, are recorded and are reviewed","Staff may give them, reviewed occasionally","Staff decide and it is rarely reviewed","No record is kept"]],
["cus","How are customer returns handled?",["Written policy, item checked and stock updated","A policy exists but is followed inconsistently","Case by case","No process"]],
["tech","Where do your business records live?",["A secure system or cloud with backups","A mix of system and spreadsheets","Spreadsheets or paper on one computer or in one office","Staff phones, chats and loose papers"]],
["tech","If your computer, phone or system was lost tomorrow, what happens?",["Records are backed up and restored quickly","Partly backed up","Backups are rare","We would lose most records"]],
["comp","How do you track licences, tax and statutory obligations?",["A calendar or checklist with a named owner, filed on time","The owner remembers, mostly on time","Handled when reminders or penalties arrive","Not sure what we owe"]],
["comp","Do you have insurance, and is customer data protected?",["Insurance in place and access to customer data is controlled","Some insurance or some data protection","We are thinking about it","Neither"]],
["comp","The same shortage or discrepancy shows up three months in a row. What do you do?",["Do a root-cause review, fix the control and monitor","Warn the staff and watch","Treat it as a normal cost of business","We wouldn't notice it was repeating"],1],
["grow","Which reports do you see regularly?",["Weekly sales, stock, cash and margin reports","Sales and cash only","Bank balance and gut feel","We rarely see reports"]],
["grow","Sales double over six months. What happens to your controls?",["They are built to scale; we would add people and review them","Some would need fixing, but the base is solid","They would be stretched, and we would add controls once problems appear","They would break down"],1]
];
// Paste your Google Apps Script web app URL between the quotes. Leave empty to turn sending off.
var SHEET_URL="";
var app=document.getElementById("app"),type=null,list=[],ans=[],idx=0;
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fill(t){return t.replace(/\{i\}/g,TYPES[type][1]).replace(/\{s\}/g,TYPES[type][2])}
function start(){
 type=null;
 var h='<h1>Business Control Check</h1><p class="mut">Answer questions about how your business handles cash, stock and processes. You will get a report showing where you are most exposed and what to fix first. It takes about 10 minutes. At the end you can choose whether to share your answers with GLEE Controls.</p><div class="card"><h3>What kind of business do you run?</h3><p class="mut">The questions adapt to your answer.</p>';
 Object.keys(TYPES).forEach(function(k){h+='<button class="opt" data-t="'+k+'">'+esc(TYPES[k][0])+'</button>'});
 app.innerHTML=h+'</div>';
 app.querySelectorAll("[data-t]").forEach(function(b){b.onclick=function(){begin(b.getAttribute("data-t"))}});
 window.scrollTo(0,0);
}
function begin(k){
 type=k;idx=0;ans=[];
 list=Q.filter(function(q){return !q[4]||q[4].indexOf(k)>-1});
 show();
}
function show(){
 var q=list[idx],pct=Math.round(idx/list.length*100);
 var h='<div class="row"><span class="mut">Question '+(idx+1)+' of '+list.length+'</span><span class="mut">'+esc(AREAS.filter(function(a){return a[0]===q[0]})[0][1])+'</span></div><div class="bar"><i style="width:'+pct+'%"></i></div><div class="card">';
 h+='<span class="tag'+(q[3]?' sc':'')+'">'+(q[3]?'Scenario':'Question')+'</span><h2>'+esc(fill(q[1]))+'</h2>';
 q[2].forEach(function(o,i){h+='<button class="opt'+(ans[idx]===i?' sel':'')+'" data-o="'+i+'">'+esc(o)+'</button>'});
 h+='</div><div class="row" style="margin-top:14px">'+(idx>0?'<button class="ghost" id="back">Back</button>':'<button class="ghost" id="restart">Change business type</button>')+'</div>';
 app.innerHTML=h;
 app.querySelectorAll("[data-o]").forEach(function(b){b.onclick=function(){
  ans[idx]=+b.getAttribute("data-o");
  if(idx<list.length-1){idx++;show()}else{details()}
 }});
 var bk=document.getElementById("back");if(bk)bk.onclick=function(){idx--;show()};
 var rs=document.getElementById("restart");if(rs)rs.onclick=start;
 window.scrollTo(0,0);
}
function details(){
 app.innerHTML='<h1>Almost done</h1><div class="card"><p class="mut">Add your details if you would like GLEE Controls to follow up with you. All fields are optional.</p><input class="in" id="dn" placeholder="Business name" autocomplete="organization"><input class="in" id="dp" placeholder="Your name" autocomplete="name"><input class="in" id="dc" placeholder="Phone or email" autocomplete="off"><label class="ck"><input type="checkbox" id="dk"><span>I agree that GLEE Controls may receive my answers and contact details to follow up with me. If I leave this unticked, nothing is sent.</span></label><button class="btn" id="go">See my report</button></div><div class="row" style="margin-top:14px"><button class="ghost" id="back">Back</button></div>';
 document.getElementById("go").onclick=function(){
  var v=function(i){return document.getElementById(i).value.trim().slice(0,200)};
  report({ok:document.getElementById("dk").checked,business:v("dn"),name:v("dp"),contact:v("dc")});
 };
 document.getElementById("back").onclick=function(){idx=list.length-1;show()};
 window.scrollTo(0,0);
}
function send(d,res,ov,overall){
 if(!SHEET_URL||!d||!d.ok)return;
 try{
  var weak=res.filter(function(r){return r.wi>=2}).map(function(r){return r.a[1]+": "+r.worst.a}).join(" | ");
  fetch(SHEET_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({
   type:TYPES[type][0],business:d.business,name:d.name,contact:d.contact,overall:ov[0],pct:Math.round(overall*100),
   areas:res.map(function(r){return lvl(r.p)[0]}),weak:weak})}).catch(function(){});
 }catch(e){}
}
function lvl(p){return p<0.3?["Low","l"]:p<0.6?["Medium","m"]:["High","h"]}
function report(d){
 var tot=0,res=AREAS.map(function(a){
  var s=0,n=0,worst=null,wi=-1;
  list.forEach(function(q,i){if(q[0]===a[0]){s+=ans[i];n++;if(ans[i]>wi){wi=ans[i];worst={q:fill(q[1]),a:q[2][ans[i]]}}}});
  tot+=s;return{a:a,p:s/(n*3),worst:worst,wi:wi};
 });
 var overall=tot/(list.length*3),ov=overall<0.25?["Low","l"]:overall<0.5?["Moderate","m"]:["High","h"];
 send(d,res,ov,overall);
 var top=res.slice().sort(function(x,y){return y.p-x.p}).filter(function(r){return r.p>=0.3}).slice(0,3);
 var h='<div class="noprint row" style="margin-bottom:14px"><span class="mut">'+esc(TYPES[type][0])+'</span></div><h1>GLEE Business Control Check</h1><div class="card" style="margin-bottom:22px"><span class="mut">Overall control exposure</span><p class="big '+ov[1]+'">'+ov[0]+'</p></div>';
 h+='<table><tr><th>Area</th><th>Status</th></tr>';
 res.forEach(function(r){var l=lvl(r.p);h+='<tr><td>'+esc(r.a[1])+'</td><td class="'+l[1]+'">'+l[0]+'</td></tr>'});
 h+='</table><h2>Priority control gaps</h2>';
 if(!top.length)h+='<p>No major gaps found. Keep testing your controls regularly, especially as the business grows.</p>';
 top.forEach(function(r,i){
  h+='<div class="gap"><h3>'+(i+1)+'. '+esc(r.a[1])+'</h3><p style="margin-bottom:6px"><b>Why it matters:</b> '+esc(r.a[2])+'</p>';
  if(r.wi>=2)h+='<p style="margin-bottom:6px"><b>Weakest answer:</b> '+esc(r.worst.a)+'</p>';
  h+='<p style="margin:0"><b>What to check or fix:</b> '+esc(r.a[3])+'</p></div>';
 });
 h+='<h2>What to fix next</h2><ol>';
 (top.length?top:res.slice().sort(function(x,y){return y.p-x.p}).slice(0,2)).forEach(function(r){h+='<li style="margin-bottom:8px">'+esc(r.a[3])+'</li>'});
 h+='</ol><p class="mut" style="font-size:14px">This check is a guide based on your own answers. It is not an audit.</p>';
 h+='<div class="noprint row" style="margin-top:18px"><button class="btn" id="print">Save as PDF / Print</button><button class="ghost" id="again">Start again</button></div>';
 app.innerHTML=h;
 document.getElementById("print").onclick=function(){window.print()};
 document.getElementById("again").onclick=start;
 window.scrollTo(0,0);
}
start();
</script>
</body>
</html>
